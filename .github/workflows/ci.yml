name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately no RUSTFLAGS: -D warnings.
  #
  # Cargo.toml already denies clippy::all, unwrap_used and panic -- the lints
  # that matter. clippy::pedantic is set to warn on top of that, and it carries
  # style opinions (doc_markdown and friends) that are useful as hints but make
  # a poor gate: turning them into errors means a build breaks over a missing
  # pair of backticks. Advisory lints advise; denied lints block.

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show          # rust-toolchain.toml drives the version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  mpv:
    name: mpv IPC (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install mpv
        run: choco install mpv --no-progress -y
      - name: Playback tests against a real mpv
        # mpv own synthetic test pattern, with video and audio output disabled:
        # this exercises process launch and the JSON IPC channel, which is where
        # the risk is, and needs no display and no sample file.
        run: cargo test -- --ignored --test-threads=1

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
